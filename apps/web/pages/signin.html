<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In &bull; Animyx • Your Anime Tracking Dashboard</title>
  <meta name="description" content="Sign in to Animyx - Your Anime Tracking Dashboard. Keep track of your watched anime, discover new favorites, and sync your progress.">
  <meta name="keywords" content="anime tracker, sign in, anime dashboard, myanimelist sync">
  <link rel="canonical" href="https://animyx.onrender.com/pages/signin.html">
  <link rel="icon" href="/images/favicon.png" />
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Rajdhani:wght@500;600;700&family=Noto+Sans+JP:wght@700;900&display=swap" rel="stylesheet">
  
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Premium Auth styles -->
  <link rel="stylesheet" href="/css/premium-auth.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#07090f">
</head>

<body>
  <!-- Sakura Petal Animation -->
  <div class="sakura-container">
    <div class="petal" style="left: 15%; animation-delay: 1s;"></div>
    <div class="petal" style="left: 35%; animation-delay: 3s;"></div>
    <div class="petal" style="left: 55%; animation-delay: 0s;"></div>
    <div class="petal" style="left: 75%; animation-delay: 2s;"></div>
    <div class="petal" style="left: 85%; animation-delay: 4s;"></div>
  </div>

  <div class="premium-auth-wrapper">
    <div class="auth-logo">ANIMYX</div>
    
    <!-- ── CENTER PANEL: Main Form ── -->
    <main class="panel-center">
      <div class="glass-card auth-form-section animate-enter">
        <header class="auth-header">
          <div class="auth-title">
            <span class="small auth-welcome">Welcome back</span>
            <span class="main">Sign In.</span>
          </div>
          <p class="auth-subtitle">No account? <a href="signup.html">Sign up free</a></p>
        </header>

        <div class="auth-form-body">
          <!-- Backend error -->
          <div id="backend-error" class="backend-error" role="alert" aria-live="polite"></div>

          <form id="signin-form" class="auth-form">

          <!-- Email -->
          <div class="form-group">
            <label for="email">Email Address</label>
            <div class="input-wrapper">
              <i class="fas fa-envelope input-icon"></i>
              <input type="email" id="email" name="email" class="auth-input" placeholder="you@example.com" autocomplete="email" required>
            </div>
            <div class="input-error"></div>
          </div>

          <!-- Password -->
          <div class="form-group">
            <label for="password">Password</label>
            <div class="input-wrapper">
              <i class="fas fa-lock input-icon"></i>
              <input type="password" id="password" name="password" class="auth-input" placeholder="Enter your password" autocomplete="current-password" required>
              <button type="button" class="toggle-password" data-target="password" aria-label="Toggle password visibility">
                <i class="fas fa-eye-slash"></i>
              </button>
            </div>
            <div class="input-error"></div>
          </div>

          <!-- Options -->
          <div class="form-group" style="flex-direction: row; justify-content: space-between; align-items: center; margin-top: 0.5rem;">
            <label class="minimal-remember">
              <input type="checkbox" id="remember">
              <span class="dot"></span>
              Remember me
            </label>
            <a href="forgot-password.html" class="forgot-link minimal-forgot" style="font-size: 0.85rem; color: var(--p-muted); text-decoration: none; transition: color 0.15s;">Forgot password?</a>
          </div>

          <!-- Submit -->
          <button type="submit" id="signin-btn" class="btn-premium-submit">
            <span class="btn-text">Sign In</span>
            <div class="spinner"></div>
          </button>
        </form>
      </div>

        <!-- Social login -->
        <div class="social-divider"><span>Or continue with</span></div>
        <div class="social-row">
          <a href="#" class="social-btn" id="btn-google">
            <i class="fab fa-google"></i>
            <span>Google</span>
          </a>
        </div>
      </div>
    </main>

  </div>

  <script src="/env.js"></script>
  <script type="module" src="../src/features/auth/signinEnhancements.js"></script>
  <script type="module" src="../src/features/auth/auth.js"></script>
</body>
</html>
