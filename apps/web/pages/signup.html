<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account &bull; Animyx Premium</title>
  <link rel="icon" href="/images/favicon.png" />
  <meta name="description" content="Create your premium Animyx account — start tracking and discovering anime today.">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Rajdhani:wght@500;600;700&family=Noto+Sans+JP:wght@700;900&display=swap" rel="stylesheet">
  
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Premium Auth styles -->
  <link rel="stylesheet" href="/css/premium-auth.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#07090f">
</head>

<body>
  <!-- Sakura Petal Animation -->
  <div class="sakura-container">
    <div class="petal" style="left: 10%; animation-delay: 0s;"></div>
    <div class="petal" style="left: 25%; animation-delay: 2s;"></div>
    <div class="petal" style="left: 45%; animation-delay: 4s;"></div>
    <div class="petal" style="left: 65%; animation-delay: 1s;"></div>
    <div class="petal" style="left: 85%; animation-delay: 3s;"></div>
    <div class="petal" style="left: 95%; animation-delay: 5s;"></div>
  </div>

  <div class="premium-auth-wrapper">
    
    <!-- ── CENTER PANEL: Main Form ── -->
    <main class="panel-center">
      <div class="glass-card auth-form-section animate-enter">
        <header class="auth-header">
          <div class="auth-title">
            <span class="small auth-welcome">Create your</span>
            <span class="main">Account.</span>
          </div>
          <p class="auth-subtitle">Already have one? <a href="signin.html">Sign in</a></p>
        </header>

        <div class="auth-form-body">
          <!-- Backend error -->
          <div id="backend-error" class="backend-error" role="alert" aria-live="polite"></div>

          <form id="signup-form" class="auth-form">
          
          <!-- Archetype Picker -->
          <div class="archetype-section">
            <span class="archetype-label">Choose your anime archetype</span>
            <div class="archetype-grid" role="radiogroup" aria-label="Anime avatar selection">
              
              <label class="hexagon-option">
                <input type="radio" name="avatar_id" value="1" checked>
                <div class="hexagon-shape">
                  <span class="kanji">勇</span>
                </div>
                <span class="archetype-name">Hero</span>
              </label>

              <label class="hexagon-option">
                <input type="radio" name="avatar_id" value="2">
                <div class="hexagon-shape">
                  <span class="kanji">愛</span>
                </div>
                <span class="archetype-name">Idol</span>
              </label>

              <label class="hexagon-option">
                <input type="radio" name="avatar_id" value="3">
                <div class="hexagon-shape">
                  <span class="kanji">刃</span>
                </div>
                <span class="archetype-name">Ronin</span>
              </label>

              <label class="hexagon-option">
                <input type="radio" name="avatar_id" value="4">
                <div class="hexagon-shape">
                  <span class="kanji">霊</span>
                </div>
                <span class="archetype-name">Yōkai</span>
              </label>

              <label class="hexagon-option">
                <input type="radio" name="avatar_id" value="5">
                <div class="hexagon-shape">
                  <span class="kanji">巫</span>
                </div>
                <span class="archetype-name">Miko</span>
              </label>

              <label class="hexagon-option">
                <input type="radio" name="avatar_id" value="6">
                <div class="hexagon-shape">
                  <span class="kanji">忍</span>
                </div>
                <span class="archetype-name">Shinobi</span>
              </label>

            </div>
          </div>

          <!-- Username -->
          <div class="form-group">
            <label for="username">Username</label>
            <div class="input-wrapper">
              <i class="fas fa-user input-icon"></i>
              <input type="text" id="username" name="username" class="auth-input" placeholder="otaku_kun" required>
              <span id="username-indicator" class="availability-indicator"></span>
            </div>
            <div class="input-error"></div>
          </div>

          <!-- Email -->
          <div class="form-group">
            <label for="email">Email Address</label>
            <div class="input-wrapper">
              <i class="fas fa-envelope input-icon"></i>
              <input type="email" id="email" name="email" class="auth-input" placeholder="you@example.com" required>
            </div>
            <div class="input-error"></div>
          </div>

          <!-- Password -->
          <div class="form-group">
            <label for="password">Password</label>
            <div class="input-wrapper">
              <i class="fas fa-lock input-icon"></i>
              <input type="password" id="password" name="password" class="auth-input" placeholder="Create a strong password" required>
              <button type="button" class="toggle-password" data-target="password" aria-label="Toggle password visibility">
                <i class="fas fa-eye-slash"></i>
              </button>
            </div>
            <div class="input-error"></div>
            <!-- Strength meter (JS-controlled) -->
            <div class="strength-meter" id="password-strength">
              <div class="strength-bar"></div>
            </div>
          </div>

          <!-- Terms -->
          <div class="form-group">
            <label class="minimal-remember">
              <input type="checkbox" id="terms" required>
              <span class="dot"></span>
              I agree to the <a href="terms.html" style="color: var(--p-accent); text-decoration: none;">Terms &amp; Conditions</a>
            </label>
            <div class="input-error"></div>
          </div>

          <!-- Submit -->
          <button type="submit" id="signup-btn" class="btn-premium-submit">
            <span class="btn-text">Create Account</span>
            <div class="spinner"></div>
          </button>
        </form>
      </div>

        <!-- Social login -->
        <div class="social-divider"><span>Or sign up with</span></div>
        <div class="social-row">
          <a href="#" class="social-btn" id="btn-google">
            <i class="fab fa-google"></i>
            <span>Google</span>
          </a>
        </div>
      </div>
    </main>

  </div>

  <script src="/env.js"></script>
  <script type="module" src="../src/features/auth/auth.js"></script>
</body>
</html>
